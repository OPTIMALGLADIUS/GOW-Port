name: Archive Test
on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'true'
jobs:
  build:
    name: Build my artifact
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: |
          echo "Free space:"
          df -h
          
    - name: Downloading the archive
      run: |
        sudo apt install wget -y
        wget -O Sekiro.zip https://tunnel5.dlproxy.uk/download/A4DRljL3YcUzm9Azgc_rl9sxmLEOdzikjWwB9szZdhqYA4e58IbJlZmMqUvZYm5qps4OXUsCg7pDHk7J6R_yvlbZfEtck3wR4prusAZneSrJNcuXAYZGm3a1YAoWffHCOsE8Hh2zMIs9jhx49NUgwh3cmOBI-f1VHCyyzLceWIDHIo1LkviSShEZViNZ_gESEuLj-HI953fq8e2AQCyjg-Sy9Y3Mv70bJTYGMK59jNM9ubyViMiY_OAgxYvvmQJKOl6_vrcEfiUOgkQgXE5lz0eo2Ng-INiOVCmoGUoQTDXCGYYXDmZejIGnj8nmpkW8z3L7KxaP507a6R5QXB7mLtVbuJMLYACyEI-hkuAayQ7lGKqAcjHQv6lY7eTMfKZGJmkKDvXKI3Ckh2X85KKBjRxPhILNidbVFy7NVlZPE1k?sig=SIDPbg99h4lusN3zH0N9W4IAswPPdNmHqUFGRXUpMBQ

    - name: Checking archive
      run: bash archive-test.sh
      
    - name: Upload Data1.bdt
      uses: actions/upload-artifact@v7
      with:
        name: Data1
        path: ${{ github.workspace }}/Sekiro/Data1.bdt

    - name: Upload Data1.bhd
      uses: actions/upload-artifact@v7
