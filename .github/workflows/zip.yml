name: Archive Test
on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'
jobs:
  build:
    name: Build my artifact
    runs-on: ubuntu-latest
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-docker-images: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: |
          echo "Free space:"
          df -h
          
    - name: Downloading the archive
      run: |
        sudo apt install wget -y
        wget -O Sekiro.zip https://tunnel5.dlproxy.uk/download/CyQUAY30fqzj8MUP7lV4qR_92ZUQVdgbeFtfhI1yFBjwB4wiv2eoaCkIafO8CF7xxtnQ0IRKWU4er0ordPk3tI3K7aBJKCb_Sw2Qv16303VOYkmihCLuns5lrVU4dfg3yQQq-xNUnJSR9d4ccEZ7sEjTr-WoqjnDItis0ds7Bx0jUMotuBcMOCngpQZC_M_qfHP40yOeeoq4Vw8sdVVIgMXAq8E1IZwoOlf-f4cVqU4Ouy7Y2Its7d5ZUiofFCm22j6e8rP3BifeF1F_lJqM1U2fRS66pz4SvUVp2gJSOsVMa1cKsjjNzBZlE4GjMhZyzmO1sCjaxrzpiKFxZQfL1mcCgPFKj_5xAC1hjP9D1DC1Lrm7TeoXQja7GnJzxFIUQPwG9-RiJTPsLJcDK5Ql0X0QhXFEgPvPWxRg506GAMc?sig=eLEmkrThVnihd174QggEcvOUMAqJygEScHualRpwPss
        
    - name: Checking archive
      run: bash archive-test.sh
