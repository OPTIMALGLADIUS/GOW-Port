name: Archive Test
on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'
jobs:
  build:
    name: Build my artifact
    runs-on: ubuntu-latest
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-docker-images: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Build
      run: |
          echo "Free space:"
          df -h
          
    - name: Downloading the archive
      run: |
        sudo apt install wget -y
        wget -O God-Of-War-AnkerGames.zip https://tunnel5.dlproxy.uk/download/A4DRljL3YcUzm9Azgc_rlxh37vh0RYqALbr1pTD-V_oTcvmSJKCUusjA9g3XrV7F1BBwMxCu9QH6HjUeLdZjO0sOnaw8zBrpl2GiBVfTyBUVkPgI7Vv1a_9c9xvlvSXdM_gtgyB_sZZm0oqzcc8sanZ-Suz6e6Cvq3iDTtYAO3v7WYQvAbuO3yU7hNenEaiwnSpGpFRTcEEpkwKWS9s3xAsgRY_Q0jgUm4pThnwLkguzi8qeG8yi5JmihElMxjAk2sXSoSByxObaSmv2MZUyC0Ol214-zEeIf_oJjzEdVygEoiMRrRtGkm1zpgZFFAlh4qo36BIFB-u8-8cBVHcEyb5hEr648w8S-2iMMyOjadhG6jTclSjvYxRB-kK_VF9MyiZbpjPjg1TmbUPhbM-oQg?sig=vjjuPfusrCGY4tXhahl2142sbbYgcgpcNTH14HP2zaQ
        
    - name: Checking archive
      run: bash archive-test.sh
