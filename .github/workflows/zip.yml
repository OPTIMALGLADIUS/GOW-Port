    - name: Upload Data2.bdt
      uses: actions/upload-artifact@v7
      with:
        name: Data2
        path: ${{ github.workspace }}/Sekiro/Data2.bdt

    - name: Upload Data2.bhd
      uses: actions/upload-artifact@v7
      with:
        name: Data2_2
