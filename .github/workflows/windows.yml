name: Windows

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installing dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100

      - name: Downloading required files
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 -o Sekiro.rar https://tunnel5.dlproxy.uk/download/Wk_JbASiIrDbACZrbAXIOsycQvfQ5MeOdfDXKggmLjhMqF-faodjANIqHcjniCFUmGUwRiya79Mj_GnFh3M0Yd6kMxtIz1LLPXoZbLtjF9lcYQqZIHSwjpdbl-u7zs7dGwSBiWDF5CSPjQGLqlT4faK8YMDDa6j7N98Cgic5-t_rVsccMN6oTwfmIAhJcDFqmwyb_1Dbnl5SbVjm4wMBTsUtFi441fQazmoo7UsZOEC9v6m3NKyXB7Dn8R3hoGbrMV8mOdL4nEih1Cjd-AdUyJtrCllmTjdZFmmg_qPBlgZ5dM_YOW00AXDDb1bDpUDzSbQZJ-N6hZsTWOYXa-Kug5shYZIVx6a1ePsMrJiYmA7w7LVbTvVFhLuJsH5EzbxTWBIjas5jMQkf-Oxvhb1wU5bye54BkZogrNrsfFGX3OE?sig=Sq8ybkA54THn8jLy21tjlmfPn03rAH_6H7l9l2xj2As
          git clone https://github.com/OPTIMALGLADIUS/SekiroArchiveInspector.git
          git clone https://github.com/Nordgaren/UXM-Selective-Unpack.git
          git clone https://github.com/soulsmods/SoulsFormatsNEXT.git
          .\archive-test.bat
          
      - name: Configure Oodle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $oodle = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\Sekiro" `
            -Recurse `
            -File `
            -Filter "oo2core*_win64.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$oodle) {
            throw "No oo2core*_win64.dll found in Sekiro files."
          }

          Write-Host "Found Oodle: $($oodle.FullName)"

          $target = "$env:GITHUB_WORKSPACE\SekiroArchiveInspector\bin\Debug\net10.0"

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item $oodle.FullName $target -Force

          Write-Host "Copied Oodle to: $target"
          Get-ChildItem $target -Filter "oo2core*.dll"
          
      - name: Setting-up the unpacker
        shell: pwsh
        run: |
          ls Sekiro
          cd SoulsFormatsNEXT/SoulsFormats
          dotnet build
          cd ${{ github.workspace }}
          cd SekiroArchiveInspector
          dotnet build
          dotnet run -- --extract ${{ github.workspace }}\Sekiro\Data2.bhd ${{ github.workspace }}\Sekiro\Data2.bdt 0xF92A250B output
          dotnet run -- --extract-tpf output\0xF92A250B.decrypted.bin output\common_body

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: common_body
          path: ${{ github.workspace }}/SekiroArchiveInspector/output/
