name: Windows

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.402
            9.0.319

      - name: Download required files and prepare archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          curl.exe -L --fail --retry 3 `
            -o Sekiro.rar `
            "https://tunnel5.dlproxy.uk/download/CyQUAY30fqzj8MUP7lV4qR_92ZUQVdgbeFtfhI1yFBjwB4wiv2eoaCkIafO8CF7xxtnQ0IRKWU4er0ordPk3tKzIb1xjfYmoM1E2SuRaIBjYJ3hGVeCX8r2COfgVevsc68bdX3cuSUDzxrNwUVWtapA84VnkvDffMkj4HiW-y0jsaaxp1uPd9N1zumShJ04JZ1TlPxpCnKaR-IaoW6prvD4lf-gSwli97JkbC2Sh8qo1Oe3Yy0W4y2DxN5YX0BUA_jPW55mwiSeiWU1OAohh18zevnnxy65TCSdyJjyT36RchrzmE0oHZ6VASJOzg8kfEI2_kyz63jGm4as4TvVszRoKAGzACYmOlaN3YY4clmKt09ITTRNCcqgwfTonJut8b1oo_vwXNnJd0NArMMkqK2G95Z0fivK4uD3PdXcO4Go?sig=zfPtCrbjnqox0WxcDgoDTyRGr-oRzKnsaKzra4LWijs"

          if ($LASTEXITCODE -ne 0) {
            throw "Sekiro archive download failed."
          }

          git clone https://github.com/OPTIMALGLADIUS/SekiroArchiveInspector.git
          if ($LASTEXITCODE -ne 0) {
            throw "SekiroArchiveInspector clone failed."
          }

          git clone https://github.com/Nordgaren/UXM-Selective-Unpack.git
          if ($LASTEXITCODE -ne 0) {
            throw "UXM-Selective-Unpack clone failed."
          }

          git clone https://github.com/OPTIMALGLADIUS/SoulsFormatsNEXT.git
          if ($LASTEXITCODE -ne 0) {
            throw "SoulsFormatsNEXT clone failed."
          }

          .\archive-test.bat
          if ($LASTEXITCODE -ne 0) {
            throw "Archive preparation failed."
          }

      - name: Build SoulsFormatsNEXT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ github.workspace }}\SoulsFormatsNEXT\SoulsFormats\SoulsFormats.csproj"

          dotnet build $project --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "SoulsFormatsNEXT build failed."
          }

      - name: Build SekiroArchiveInspector
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ github.workspace }}\SekiroArchiveInspector\SekiroArchiveInspector.csproj"

          dotnet build $project --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "SekiroArchiveInspector build failed."
          }

      - name: Verify required archive files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bhd = "${{ github.workspace }}\Sekiro\Data2.bhd"
          $bdt = "${{ github.workspace }}\Sekiro\Data2.bdt"

          if (!(Test-Path $bhd)) {
            throw "Data2.bhd was not found: $bhd"
          }

          if (!(Test-Path $bdt)) {
            throw "Data2.bdt was not found: $bdt"
          }

          Write-Host "Archive files found:"
          Get-Item $bhd, $bdt | Select-Object Name, Length

      - name: Configure Oodle for runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $oodle = Get-ChildItem "${{ github.workspace }}\Sekiro" `
            -Recurse -File `
            -Filter "oo2core_6_win64.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$oodle) {
            throw "Sekiro's oo2core_6_win64.dll was not found."
          }

          $runtimeDir = "${{ github.workspace }}\SekiroArchiveInspector\bin\Release\net10.0"

          if (!(Test-Path $runtimeDir)) {
            throw "Inspector runtime directory not found: $runtimeDir"
          }

          Copy-Item $oodle.FullName `
            (Join-Path $runtimeDir "oo2core_6_win64.dll") `
            -Force

          Write-Host "Oodle copied to runtime directory:"
          Get-Item (Join-Path $runtimeDir "oo2core_6_win64.dll")

      - name: Run SekiroArchiveInspector extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = "${{ github.workspace }}\SekiroArchiveInspector"
          $bhd = "${{ github.workspace }}\Sekiro\Data2.bhd"
          $bdt = "${{ github.workspace }}\Sekiro\Data2.bdt"
          $outputDir = Join-Path $projectDir "output\Data2"

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          Push-Location $projectDir
          try {
            dotnet run `
              --configuration Release `
              --no-build `
              -- `
              --extract-all `
              $bhd `
              $bdt `
              $outputDir

            if ($LASTEXITCODE -ne 0) {
              throw "Extraction failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          $extractedFiles = @(
            Get-ChildItem $outputDir -Recurse -File
          )

          if ($extractedFiles.Count -eq 0) {
            throw "Extraction completed but produced no files."
          }

          Write-Host "Extraction produced $($extractedFiles.Count) files."

          $extractedFiles |
            Select-Object -First 20 FullName, Length |
            Format-Table -AutoSize

      - name: Classify extracted files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = "${{ github.workspace }}\SekiroArchiveInspector"
          $inputDir = Join-Path $projectDir "output\Data2"
          $classificationDir = Join-Path $projectDir "output\Classification"
          $csvPath = Join-Path $classificationDir "Data2-classification.csv"

          New-Item -ItemType Directory -Force -Path $classificationDir | Out-Null

          Push-Location $projectDir
          try {
            dotnet run `
              --configuration Release `
              --no-build `
              -- `
              --classify-all `
              $inputDir `
              $csvPath

            if ($LASTEXITCODE -ne 0) {
              throw "Classification failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          if (!(Test-Path $csvPath)) {
            throw "Classification CSV was not created: $csvPath"
          }

          Write-Host "Classification report created:"
          Get-Item $csvPath | Select-Object FullName, Length

      - name: Analyze and decompress payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = "${{ github.workspace }}\SekiroArchiveInspector"
          $inputDir = Join-Path $projectDir "output\Data2"
          $analysisDir = Join-Path $projectDir "output\PayloadAnalysis\Data2"
          $reportPath = Join-Path $analysisDir "payload-analysis.json"

          New-Item -ItemType Directory -Force -Path $analysisDir | Out-Null

          Push-Location $projectDir
          try {
            dotnet run `
              --configuration Release `
              --no-build `
              -- `
              --analyze-payloads `
              $inputDir `
              $analysisDir

            if ($LASTEXITCODE -ne 0) {
              throw "Payload analysis failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          if (!(Test-Path $reportPath)) {
            throw "Payload analysis report was not created: $reportPath"
          }

          Write-Host "Payload analysis report created:"
          Get-Item $reportPath | Select-Object FullName, Length

          $decompressedFiles = @(
            Get-ChildItem $analysisDir -Recurse -File |
              Where-Object { $_.Name -like "*.decompressed.bin" }
          )

          Write-Host "Decompressed payload files: $($decompressedFiles.Count)"

      - name: Summarize generated outputs
        if: always()
        shell: pwsh
        run: |
          $outputDir = "${{ github.workspace }}\SekiroArchiveInspector\output"

          if (Test-Path $outputDir) {
            Write-Host "Generated output files:"

            Get-ChildItem $outputDir -Recurse -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            $totalBytes = (
              Get-ChildItem $outputDir -Recurse -File |
                Measure-Object -Property Length -Sum
            ).Sum

            if ($null -eq $totalBytes) {
              $totalBytes = 0
            }

            Write-Host "Total output size: $totalBytes bytes"
          }
          else {
            Write-Host "Output directory has not been created."
          }

      - name: Upload extracted files and analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: common_body
          path: |
            ${{ github.workspace }}/SekiroArchiveInspector/output/
          if-no-files-found: warn
          retention-days: 7
