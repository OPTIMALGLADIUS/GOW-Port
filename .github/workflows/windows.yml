name: Windows

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.402
            9.0.319

      - name: Download required files and prepare archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          curl.exe -L --fail --retry 3 `
            -o Sekiro.rar `
            "https://tunnel5.dlproxy.uk/download/CyQUAY30fqzj8MUP7lV4qR_92ZUQVdgbeFtfhI1yFBjwB4wiv2eoaCkIafO8CF7xxtnQ0IRKWU4er0ordPk3tF6oyNYBep2N_23RfHyg9MUTkiTw3HNEPgbKJCHBT7J99ff5QXkHLf8q9Eky_L_X-ME-20PhjqaVFfAD-UE3XZmdZeuKmtHMleNUSE4nt1IAvFMikgRGv01hMX7k6e6kyo-yv4XFutEvfSJhsRUwoGf9z9MK6j-2ItQ_lPJ6DM5pTwDpbDzkVXeWS8t_bTojEB4Gf7tOWnLfLZu3NJWOigaHpx5cFQV2fWMFxrLpsxj6v-9cIQZLnT2PTLaLyN6_r0cjJHjvLuy2JmroDjB1rRSlCGQqFAjiJL3X1FDsJKJAKD6OX7N4IZMSsrpkbaY06eVqRqPsbOCPvvQtaROpazQ?sig=VSEIJFtXqgioWrX7fTkTAIna0GP92pr3N2xheTiyyL4"

          if ($LASTEXITCODE -ne 0) {
            throw "Sekiro archive download failed."
          }

          git clone https://github.com/OPTIMALGLADIUS/SekiroArchiveInspector.git
          if ($LASTEXITCODE -ne 0) {
            throw "SekiroArchiveInspector clone failed."
          }

          git clone https://github.com/Nordgaren/UXM-Selective-Unpack.git
          if ($LASTEXITCODE -ne 0) {
            throw "UXM-Selective-Unpack clone failed."
          }

          git clone https://github.com/OPTIMALGLADIUS/SoulsFormatsNEXT.git
          if ($LASTEXITCODE -ne 0) {
            throw "SoulsFormatsNEXT clone failed."
          }

          .\archive-test.bat
          if ($LASTEXITCODE -ne 0) {
            throw "Archive preparation failed."
          }

      - name: Build SoulsFormatsNEXT
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ github.workspace }}\SoulsFormatsNEXT\SoulsFormats\SoulsFormats.csproj"

          dotnet build $project --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "SoulsFormatsNEXT build failed."
          }

      - name: Build SekiroArchiveInspector
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $project = "${{ github.workspace }}\SekiroArchiveInspector\SekiroArchiveInspector.csproj"

          dotnet build $project --configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "SekiroArchiveInspector build failed."
          }

      - name: Verify required archive files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $bhd = "${{ github.workspace }}\Sekiro\Data2.bhd"
          $bdt = "${{ github.workspace }}\Sekiro\Data2.bdt"

          if (!(Test-Path $bhd)) {
            throw "Data2.bhd was not found: $bhd"
          }

          if (!(Test-Path $bdt)) {
            throw "Data2.bdt was not found: $bdt"
          }

          Write-Host "Archive files found:"
          Get-Item $bhd, $bdt | Select-Object Name, Length

      - name: Configure Oodle for runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $oodle = Get-ChildItem "${{ github.workspace }}\Sekiro" `
            -Recurse -File `
            -Filter "oo2core_6_win64.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$oodle) {
            throw "Sekiro's oo2core_6_win64.dll was not found."
          }

          $runtimeDir = "${{ github.workspace }}\SekiroArchiveInspector\bin\Release\net10.0"

          if (!(Test-Path $runtimeDir)) {
            throw "Inspector runtime directory not found: $runtimeDir"
          }

          Copy-Item $oodle.FullName `
            (Join-Path $runtimeDir "oo2core_6_win64.dll") `
            -Force

          Write-Host "Oodle copied to runtime directory:"
          Get-Item (Join-Path $runtimeDir "oo2core_6_win64.dll")

      - name: Run SekiroArchiveInspector extraction
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = "${{ github.workspace }}\SekiroArchiveInspector"
          $bhd = "${{ github.workspace }}\Sekiro\Data2.bhd"
          $bdt = "${{ github.workspace }}\Sekiro\Data2.bdt"
          $outputDir = Join-Path $projectDir "output\Data2"

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          Push-Location $projectDir
          try {
            dotnet run `
              --configuration Release `
              --no-build `
              -- `
              --extract-all `
              $bhd `
              $bdt `
              $outputDir

            if ($LASTEXITCODE -ne 0) {
              throw "Extraction failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          $extractedFiles = @(
            Get-ChildItem $outputDir -Recurse -File
          )

          if ($extractedFiles.Count -eq 0) {
            throw "Extraction completed but produced no files."
          }

          Write-Host "Extraction produced $($extractedFiles.Count) files."

          $extractedFiles |
            Select-Object -First 20 FullName, Length |
            Format-Table -AutoSize

      - name: Analyze and decompress payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = "${{ github.workspace }}\SekiroArchiveInspector"
          $inputDir = Join-Path $projectDir "output\Data2"
          $analysisDir = Join-Path $projectDir "output\PayloadAnalysis\Data2"
          $reportPath = Join-Path $analysisDir "payload-analysis.json"

          New-Item -ItemType Directory -Force -Path $analysisDir | Out-Null

          Push-Location $projectDir
          try {
            dotnet run `
              --configuration Release `
              --no-build `
              -- `
              --analyze-payloads `
              $inputDir `
              $analysisDir

            if ($LASTEXITCODE -ne 0) {
              throw "Payload analysis failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          if (!(Test-Path $reportPath)) {
            throw "Payload analysis report was not created: $reportPath"
          }

          Write-Host "Payload analysis report created:"
          Get-Item $reportPath | Select-Object FullName, Length

          $decompressedFiles = @(
            Get-ChildItem $analysisDir -Recurse -File |
              Where-Object { $_.Name -like "*.decompressed.bin" }
          )

          Write-Host "Decompressed payload files: $($decompressedFiles.Count)"

      
      - name: Extract BND4 bundles
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = "${{ github.workspace }}\SekiroArchiveInspector"
          $inputDir = Join-Path $projectDir "output\PayloadAnalysis\Data2"
          $outputDir = Join-Path $projectDir "output\Bnd4Files"
          $reportPath = Join-Path $outputDir "bnd4-extraction.json"

          if (!(Test-Path (Join-Path $inputDir "payload-analysis.json"))) {
            throw "Payload analysis report is missing."
          }

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          Push-Location $projectDir
          try {
            dotnet run `
              --configuration Release `
              --no-build `
              -- `
              --extract-bnd4 `
              $inputDir `
              $outputDir

            if ($LASTEXITCODE -ne 0) {
              throw "BND4 extraction failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          if (!(Test-Path $reportPath)) {
            throw "BND4 extraction report was not created."
          }

          $report = Get-Content $reportPath -Raw | ConvertFrom-Json

          if ($report.ArchivesFound -eq 0) {
            throw "No BND4 archives were processed."
          }

          if ($report.ArchivesFailed -ne 0) {
            throw "One or more BND4 archives failed to extract."
          }

          if ($report.EntriesExtracted -eq 0) {
            throw "BND4 extraction produced no entries."
          }

          Write-Host "BND4 extraction validated."
          Write-Host "Archives processed: $($report.ArchivesFound)"
          Write-Host "Entries extracted: $($report.EntriesExtracted)"

      - name: Extraction of TPF file
        shell: pwsh
        run: |
          $projectDir = Join-Path $PWD "SekiroArchiveInspector"

          $inputFile = Join-Path $projectDir `
          "output\Data2\00000000F92A250B.bin"

          $outputDir = Join-Path $projectDir `
          "output\TpfFiles\00000000F92A250B"

          Push-Location $projectDir
          try {
            dotnet run --configuration Release -- `
            --extract-tpf $inputFile $outputDir

          if ($LASTEXITCODE -ne 0) {
            throw "TPF extraction failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }
      
      - name: Classify extracted bundle entries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = "${{ github.workspace }}\SekiroArchiveInspector"
          $inputDir = Join-Path $projectDir "output\Bnd4Files"
          $classificationDir = Join-Path $projectDir "output\Classification"
          $csvPath = Join-Path $classificationDir "BND4-entries.csv"

          New-Item -ItemType Directory -Force -Path $classificationDir | Out-Null

          Push-Location $projectDir
          try {
            dotnet run `
              --configuration Release `
              --no-build `
              -- `
              --classify-all `
              $inputDir `
              $csvPath

            if ($LASTEXITCODE -ne 0) {
              throw "Entry classification failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          if (!(Test-Path $csvPath)) {
            throw "Classification CSV was not created: $csvPath"
          }

          Write-Host "Bundle-entry classification created:"
          Get-Item $csvPath | Select-Object FullName, Length

      
      - name: Recursively extract nested archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = Join-Path $env:GITHUB_WORKSPACE "SekiroArchiveInspector"
          $inputDir = Join-Path $projectDir "output\Bnd4Files"
          $outputDir = Join-Path $projectDir "output\RecursiveExtraction"
          $reportPath = Join-Path $outputDir "recursive-extraction.json"

          if (!(Test-Path -LiteralPath $inputDir)) {
            throw "BND4 output directory is missing: $inputDir"
          }

          Push-Location $projectDir
          try {
            dotnet run --configuration Release --no-build -- `
              --extract-recursive $inputDir $outputDir

            if ($LASTEXITCODE -ne 0) {
              throw "Recursive extraction failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          if (!(Test-Path -LiteralPath $reportPath)) {
            throw "Recursive extraction report was not created."
          }

          $report = Get-Content -LiteralPath $reportPath -Raw |
            ConvertFrom-Json

          if ($report.FilesVisited -le 0) {
            throw "Recursive extraction processed no files."
          }

          if ($report.Failures -ne 0) {
            throw "Recursive extraction reported $($report.Failures) failures."
          }

          Write-Host "Recursive extraction validated."
          Write-Host "Files visited: $($report.FilesVisited)"
          Write-Host "Containers expanded: $($report.ContainersExpanded)"
          Write-Host "Entries extracted: $($report.EntriesExtracted)"

      - name: Generate final asset inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $projectDir = Join-Path $env:GITHUB_WORKSPACE "SekiroArchiveInspector"
          $inputDir = Join-Path $projectDir "output\RecursiveExtraction"
          $inventoryDir = Join-Path $projectDir "output\Inventory"

          Push-Location $projectDir
          try {
            dotnet run --configuration Release --no-build -- `
              --inventory $inputDir $inventoryDir

            if ($LASTEXITCODE -ne 0) {
              throw "Asset inventory failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          foreach ($name in @(
            "asset-inventory.json",
            "asset-inventory.csv",
            "asset-inventory-summary.json"
          )) {
            $path = Join-Path $inventoryDir $name

            if (!(Test-Path -LiteralPath $path)) {
              throw "Expected inventory report is missing: $path"
            }

            Get-Item -LiteralPath $path |
              Select-Object Name, Length
          }
      
      - name: Clean up original compressed payloads
        shell: pwsh
        run: |
          
          $ErrorActionPreference = "Stop"

          $projectDir = "D:\a\GOW-Port\GOW-Port\SekiroArchiveInspector"
          $originalDir = Join-Path $projectDir "output\Data2"
          $payloadDir = Join-Path $projectDir "output\PayloadAnalysis\Data2"
          $bnd4ReportPath = Join-Path $projectDir "output\Bnd4Files\bnd4-extraction.json"
          
          # Require both the BND4 report and the payload-analysis report.
         
          if (!(Test-Path -LiteralPath $bnd4ReportPath)) {
            throw "BND4 report missing; refusing cleanup."
          }

          $payloadReports = @(
            Get-ChildItem `
               (Join-Path $projectDir "output\PayloadAnalysis") `
                 -Filter "payload-analysis.json" `
                 -File `
                 -Recurse
          )

          if ($payloadReports.Count -ne 1) {
            throw "Expected exactly one payload-analysis.json; found $($payloadReports.Count). Refusing cleanup."
          }

          if (!(Test-Path -LiteralPath $originalDir) -or
            !(Test-Path -LiteralPath $payloadDir)) {
            throw "Expected input or payload output directory is missing; refusing cleanup."
          }

          $bndReport = Get-Content -LiteralPath $bnd4ReportPath -Raw |
            ConvertFrom-Json

          $payloadReport = Get-Content -LiteralPath $payloadReports[0].FullName -Raw |
            ConvertFrom-Json

          # Validate BND4 extraction independently of total payload count.
          if ($bndReport.ArchivesSucceeded -le 0 -or
             $bndReport.ArchivesFailed -ne 0 -or
             $bndReport.EntriesExtracted -le 0) {
             throw "BND4 validation failed; refusing cleanup."
          }

          # Validate the payload-analysis summary.
          if ($payloadReport.TotalFiles -le 0 -or
            $payloadReport.Analyzed -ne $payloadReport.TotalFiles -or
            $payloadReport.Decompressed -ne $payloadReport.TotalFiles -or
            $payloadReport.Failed -ne 0) {
            throw "Payload-analysis summary indicates incomplete processing; refusing cleanup."
          }

          $reportFiles = @($payloadReport.Files)

          if ($reportFiles.Count -ne $payloadReport.TotalFiles) {
            throw "Payload report entry count does not match TotalFiles; refusing cleanup."
          }

          $originalBins = @(
            Get-ChildItem -LiteralPath $originalDir -File -Filter "*.bin" -Recurse
          )

          if ($originalBins.Count -ne $payloadReport.TotalFiles) {
            throw "Original BIN count does not match payload-analysis TotalFiles; refusing cleanup."
          }

          # Validate every expected decompressed file before deleting anything.
          $verifiedPayloads = 0

          foreach ($entry in $reportFiles) {
            if ($entry.Status -ne "Decompressed" -or
               $entry.Error) {
               throw "Payload was not successfully decompressed: $($entry.RelativePath)"
            }

            # Preserve any relative subdirectory structure.
            $relativeOutput = [IO.Path]::ChangeExtension(
              $entry.RelativePath, $null
              ) + ".decompressed.bin"

            $expectedOutput = Join-Path $payloadDir $relativeOutput

            if (!(Test-Path -LiteralPath $expectedOutput -PathType Leaf)) {
              throw "Expected decompressed payload is missing: $expectedOutput"
            }

            $actual = Get-Item -LiteralPath $expectedOutput

            if ($actual.Length -le 0 -or
              $actual.Length -ne $entry.FinalPayloadSizeBytes) {
              throw "Decompressed payload size validation failed: $expectedOutput"
            }

            $verifiedPayloads++
          }

          if ($verifiedPayloads -ne $payloadReport.Decompressed) {
            throw "Verified payload count does not match the report; refusing cleanup."
          }

          Write-Host "BND4 archives extracted: $($bndReport.ArchivesSucceeded)"
          Write-Host "BND4 entries extracted: $($bndReport.EntriesExtracted)"
          Write-Host "Successfully decompressed payloads: $verifiedPayloads"
          Write-Host "Original BIN files to remove: $($originalBins.Count)"

          # All checks have passed. Delete only the original BIN files.
          foreach ($file in $originalBins) {
            Remove-Item -LiteralPath $file.FullName -Force
          }

          Write-Host "Original compressed BIN files removed."
          Write-Host "Decompressed payloads and extraction reports retained."

      - name: Summarize generated outputs
        if: always()
        shell: pwsh
        run: |
          $outputDir = "${{ github.workspace }}\SekiroArchiveInspector\output"

          if (Test-Path $outputDir) {
            Write-Host "Generated output files:"

            Get-ChildItem $outputDir -Recurse -File |
              Select-Object FullName, Length |
              Format-Table -AutoSize

            $totalBytes = (
              Get-ChildItem $outputDir -Recurse -File |
                Measure-Object -Property Length -Sum
            ).Sum

            if ($null -eq $totalBytes) {
              $totalBytes = 0
            }

            Write-Host "Total output size: $totalBytes bytes"
          }
          else {
            Write-Host "Output directory has not been created."
          }

      - name: Upload extracted files and analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sekiro_bnd4_extracted
          path: |
            ${{ github.workspace }}/SekiroArchiveInspector/output/
          if-no-files-found: warn
          retention-days: 7
