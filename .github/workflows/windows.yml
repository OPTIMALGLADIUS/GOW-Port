name: Windows

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installing dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.402
            9.0.319

      - name: Downloading required files
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 -o Sekiro.rar https://tunnel5.dlproxy.uk/download/-n413Xy4X4lReGqlNAqPDCohkx4WUeFwUN1pfgrQJu-LM1Hf86w1XEjcUtl7J-lPc_d_Aa2ETSfAqm3OkD2bDvnAt9SnkbVFtytrNu-A5BtPdi10qS610zvYLQjzp3g0B3OgjUmL7DeP7f9aFQgA_XWJ9-E4OC2w99F_IjaO3PLwLZMCXo8lqtgWEj0DgALUEDBBoKs6Vlch9vpFT-VYjqYDu_QqxNd0vyNHdmFA3FkUQlLwpqoCJAePHvO3HQuu3Xvy-JfQL6cHk9_rH0K6MoCO9DRNAiN-dRHPmezUFRKZnaaF4otHJs8mvABq-qpSS1RjAUoCItp5dib8jliZcg-_N99EfFanp6s3yQU-jYEnPFPhCESr5Y_mQSRgwUoZT7JafyfMGqfLFrQTO1BaR4Pj7NZO9Y0aRV0AW1Hpztc?sig=saKCWhFA7ez4YEVgtcmH6vPZalaDTq4O34DilcrioDU
          git clone https://github.com/OPTIMALGLADIUS/SekiroArchiveInspector.git
          git clone https://github.com/Nordgaren/UXM-Selective-Unpack.git
          git clone https://github.com/OPTIMALGLADIUS/SoulsFormatsNEXT.git
          .\archive-test.bat
          
      - name: Build SoulsFormatsNEXT and SekiroArchiveInspector
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Push-Location "${{ github.workspace }}\SoulsFormatsNEXT\SoulsFormats"
          dotnet build
          if ($LASTEXITCODE -ne 0) {
            throw "SoulsFormatsNEXT build failed."
          }
          Pop-Location

          Push-Location "${{ github.workspace }}\SekiroArchiveInspector"
          dotnet build
          if ($LASTEXITCODE -ne 0) {
            throw "SekiroArchiveInspector build failed."
          }
          Pop-Location

      - name: Configure Oodle for runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $oodle = Get-ChildItem "${{ github.workspace }}\Sekiro" `
            -Recurse -File -Filter "oo2core_6_win64.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$oodle) {
            throw "Sekiro's oo2core_6_win64.dll was not found."
          }

          $runtimeDir = "${{ github.workspace }}\SekiroArchiveInspector\bin\Debug\net10.0"

          if (!(Test-Path $runtimeDir)) {
            throw "Inspector runtime directory not found: $runtimeDir"
          }

          Copy-Item $oodle.FullName `
            (Join-Path $runtimeDir "oo2core_6_win64.dll") -Force

          Write-Host "Oodle copied to runtime directory:"
          Get-ChildItem $runtimeDir -Filter "oo2core_6_win64.dll"
          
      - name: Setting-up the unpacker
        shell: pwsh
        run: |
          ls Sekiro
          cd ${{ github.workspace }}\SekiroArchiveInspector
          dotnet run -- --extract-all ${{ github.workspace }}\Sekiro\Data2.bhd ${{ github.workspace }}\Sekiro\Data2.bdt output\Data2
          dotnet run -- --extract-tpf output\0xF92A250B.decrypted.bin output\common_body

      - name: Texture decompression
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          winget install --id Microsoft.DirectXTex.Texconv `
            --exact `
            --accept-package-agreements `
            --accept-source-agreements `
            --disable-interactivity

          $texconv = Get-Command texconv.exe -ErrorAction SilentlyContinue

          if (!$texconv) {
            $texconvPath = Get-ChildItem `
              "$env:ProgramFiles\Windows Kits" `
              -Recurse `
              -Filter "texconv.exe" `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (!$texconvPath) {
              throw "texconv.exe was not found after installation."
            }

            $texconv = $texconvPath
          }

          $inputFile = Join-Path `
            $env:GITHUB_WORKSPACE `
            "SekiroArchiveInspector\output\common_body\textures\*.dds"

          $outputDir = Join-Path `
            $env:GITHUB_WORKSPACE `
            "SekiroArchiveInspector\output\textures_png"

          if (!(Test-Path $inputFile)) {
            throw "Input DDS was not found: $inputFile"
          }

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          & $texconv.Source `
            -ft png `
            -f R8G8B8A8_UNORM `
            $inputFile `
            -o $outputDir

          if ($LASTEXITCODE -ne 0) {
            throw "texconv failed with exit code $LASTEXITCODE"
          }

          Get-ChildItem $outputDir

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: common_body
          path: ${{ github.workspace }}/SekiroArchiveInspector/output/
