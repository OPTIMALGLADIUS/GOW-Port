name: Windows

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installing dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100

      - name: Downloading required files
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 -o Sekiro.rar https://tunnel5.dlproxy.uk/download/g8Yi2FxFEfmVKVki-5d2uVvslqeBPzFJagIN1CIa-F49thS3eqFfql11cj2KlnSCGvmYPU4KrnXJomW196RrciaRT9eixXLPpSIDtWq5Cs4prWxlpP2jglrji2NTlgSEdyG399h8bRQimtiAKGWqQ2rbtNup1xCwTFv6GFXDqEqLVstT4L20Reu-2wRDYbpMlXW4rIbkJlDelajcvwDmvwqup_fBgSd0frOb-_AF6hOr6zAc-EkLBXfi79PIqWMuyTX58jTb13bGVZo5dtMC_dZ_aaKYUVteqI7L7MHMGhxf6ioKTyevDaTlyNIGN0TrPxz2uktRx-PF4YzKCexjUMXl_v_YoyIk2LF5F6WKQcE8lQ3eqm-AdoieDC-OCMzlrUVFY9Gv2114_tfEazEPMHjqKnioLtmkLQZ0vMQxMP0?sig=WFVy1tFvAXkmSx9wxlghrbly2bMaCF5II1i1UElTp7k
          git clone https://github.com/OPTIMALGLADIUS/SekiroArchiveInspector.git
          git clone https://github.com/Nordgaren/UXM-Selective-Unpack.git
          git clone https://github.com/soulsmods/SoulsFormatsNEXT.git
          .\archive-test.bat
          
      - name: Configure Oodle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $oodle = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\Sekiro" `
            -Recurse `
            -File `
            -Filter "oo2core*_win64.dll" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$oodle) {
            throw "No oo2core*_win64.dll found in Sekiro files."
          }

          Write-Host "Found Oodle: $($oodle.FullName)"

          $target = "$env:GITHUB_WORKSPACE\SekiroArchiveInspector\bin\Debug\net10.0"

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item $oodle.FullName $target -Force

          Write-Host "Copied Oodle to: $target"
          Get-ChildItem $target -Filter "oo2core*.dll"
          
      - name: Setting-up the unpacker
        shell: pwsh
        run: |
          ls Sekiro
          cd SoulsFormatsNEXT/SoulsFormats
          dotnet build
          cd ${{ github.workspace }}
          cd SekiroArchiveInspector
          dotnet build
          dotnet run -- --extract ${{ github.workspace }}\Sekiro\Data2.bhd ${{ github.workspace }}\Sekiro\Data2.bdt 0xF92A250B output
          dotnet run -- --extract-tpf output\0xF92A250B.decrypted.bin output\common_body

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: common_body
          path: ${{ github.workspace }}/SekiroArchiveInspector/output/
