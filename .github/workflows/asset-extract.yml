name: Sekiro Asset Extraction - Data2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Data2 archive artifact
        run: |
          sudo apt install wget -y
          wget -O Sekiro.zip https://tunnel5.dlproxy.uk/download/HwCmxFMLdX4Jpnc5QwzZd6keZiVRUN27rnI26YqUX96Sd55TOYl4BdsWA2K9VQPKqHizK5f2IrK0HToj3Ct0fezUiNcF2u1NS8MtTh-dnnkERcg29Z_cGnQbXPeXwoPTA1wbCjkQphuLElU7glQ7jz7-KQ1ptHRsku7qc6_lNPPgc1AIJhyhtDXLE1ximemMy_JycI3v_C9V04hy_svovBf9lajqI-rNP-lyL2cFoRWggoVdW37wPmynbsAd78XHFrYu1Sgtl1swuvXoqa86OgWl0iXRZGCLLp-dO5OMCxGu9p4a4B9r9UBUy80rBpzUX4qjwRl4rsWtRC-uxJSPR_SB1R_p5RPnRI3WuMMNDGIrgjc5xvKuyRwA_UzY7IYEseYuWJW3vfdcwrfpSokNDXJqMBiNJR-v5kXdd0uWljA?sig=jfKtlQzZQRheyI8FEVV2bfcwKk_cYAUuOWZZEdz2x0U
          bash archive-test.sh

      - name: Prepare target extraction
        shell: bash
        run: |
          set -euo pipefail

          BDT="${{ github.workspace }}/Sekiro/Data2.bdt"

          # Create the output directory before writing any files.
          mkdir -p output

          # Check the actual file, not whether the path variable is empty.
          if [ ! -f "$BDT" ]; then
            echo "::error::Data2.bdt not found at $BDT"
            echo "Files extracted by archive-test.sh:"
            find "$GITHUB_WORKSPACE" -type f -iname 'Data2.bdt' -print
            exit 1
          fi

          python - "$BDT" <<'PY'
          import hashlib
          import json
          import os
          import sys

          source = sys.argv[1]
          offset = 237771568
          size = 7605872
          output = "output/common_body.raw"

          actual_size = os.path.getsize(source)

          if offset + size > actual_size:
              raise SystemExit(
                  f"Target range exceeds file size: "
                  f"offset={offset}, size={size}, file={actual_size}"
              )

          with open(source, "rb") as f:
              f.seek(offset)
              data = f.read(size)

          if len(data) != size:
              raise SystemExit("Short read while extracting target range.")

          with open(output, "wb") as f:
              f.write(data)

          report = {
              "source": source,
              "source_size": actual_size,
              "offset": offset,
              "padded_size": size,
              "extracted_size": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "first_32_bytes": data[:32].hex(" "),
              "note": (
                  "Raw archive bytes only. AES decryption and DCX "
                  "decompression have not been applied."
              )
          }

          with open("output/report.json", "w") as f:
              json.dump(report, f, indent=2)

          print(json.dumps(report, indent=2))
          PY

      
      - name: Inspect Data2 BHD metadata
        shell: bash
        run: |
          set -euo pipefail

          BHD="${{ github.workspace }}/Sekiro/Data2.bhd"
          mkdir -p output

          if [ ! -f "$BHD" ]; then
            echo "::error::Data2.bhd not found at $BHD"
            find "${{ github.workspace }}" -type f -iname 'Data2.bhd' -print
            exit 1
          fi

          python - "$BHD" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()

          target = 0xF92A250B
          patterns = {
              "little_endian_u32": target.to_bytes(4, "little"),
              "big_endian_u32": target.to_bytes(4, "big"),
              "little_endian_u64": target.to_bytes(8, "little"),
              "big_endian_u64": target.to_bytes(8, "big"),
          }

          report = {
              "file": path.name,
              "size": len(data),
              "sha256": hashlib.sha256(data).hexdigest(),
              "first_128_bytes": data[:128].hex(" "),
              "first_16_ascii": "".join(
                  chr(b) if 32 <= b < 127 else "."
                  for b in data[:16]
              ),
              "target_hash": hex(target),
              "hash_occurrences": {
                  name: [
                      i for i in range(len(data))
                      if data.startswith(pattern, i)
                  ][:100]
                  for name, pattern in patterns.items()
              },
              "known_ascii_markers": {
                  marker.decode("ascii"): data.find(marker)
                  for marker in (
                      b"BHD5", b"DCX", b"TPF", b"AES"
                  )
              },
          }

          pathlib.Path("output/bhd_inspection.json").write_text(
              json.dumps(report, indent=2)
          )
          print(json.dumps(report, indent=2))
          PY
          
      - name: Upload extraction diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: sekiro-data2-extraction-diagnostics
          path: output/
          if-no-files-found: error
          retention-days: 7
